# ASHFALL Release Workflow — Plan 48 / C2[21] Phase 4
# =====================================================
# Triggered on version tags (vX.Y.Z). Runs the release gate and exports builds.
# Only fires on properly formatted release tags — never on branch pushes.
# See docs/releases/PROCESS.md for the full ceremony.

name: ASHFALL Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          # HEAD^1 is needed by the fast-tier repository monitors this job
          # also runs (release-gate.sh runs the full fast tier, same as ci.yml).
          fetch-depth: 2

      - name: Setup Rust for repository monitors and dev tools
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Godot 4.7.1 mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      # One canonical, blocking command: fast tier + full Core suite +
      # save-support window. Never pass --skip-full here — that flag exists
      # only for a developer's local pre-tag sanity check.
      - name: Run canonical release gate
        run: bash scripts/ci/release-gate.sh

      - name: Upload Release Gate Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-reports-${{ github.ref_name }}
          path: build/reports/
          if-no-files-found: ignore

  export-release:
    name: Export Release Builds
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Godot 4.7.1 mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Run export-build.sh (Linux export + packaged parity)
        run: bash scripts/ci/export-build.sh

      - name: Export Windows Desktop
        run: |
          mkdir -p builds/windows
          bash scripts/ci/run-godot-bounded.sh --path . --export-release "Windows Desktop" builds/windows/ashfall.exe
          ls -lh builds/windows/
          test -f builds/windows/ashfall.exe

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: release-Linux-${{ github.ref_name }}
          path: builds/linux
          if-no-files-found: error

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: release-Windows-${{ github.ref_name }}
          path: builds/windows
          if-no-files-found: error
