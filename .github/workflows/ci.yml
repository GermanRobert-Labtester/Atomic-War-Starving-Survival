# ASHFALL — Godot 4.7 .NET (Canonical Shared Verification Pipeline)
# Driven by docs/ci/CI_GATE_MANIFEST.json via scripts/ci/run-gates.py.
# Local developer parity: bash scripts/ci/verify-fast.sh
# Standalone Godot host; no JsonUtility; Core stays engine-agnostic.

name: ASHFALL CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: CI Fast-Tier Gates (dotnet + godot headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDKs (8.0 for Godot host, 9.0 for tests)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Godot 4.7.1 mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Execute Canonical Verification Suite (Fast Tier)
        run: |
          python3 scripts/ci/run-gates.py --tier fast --report-json build/reports/gate-results.json --fail-artifact build/reports/CI_GATE_FAILURE_REPORT.md

      - name: Execute Full Core xUnit Regression Gate
        run: |
          python3 scripts/ci/run-gates.py --gate test_core_suite --report-json build/reports/core-test-results.json --fail-artifact build/reports/CORE_TEST_FAILURE_REPORT.md

      - name: Surface Gate Failures as Annotations
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          for report in ("build/reports/gate-results.json",
                         "build/reports/core-test-results.json"):
              rp = pathlib.Path(report)
              if not rp.is_file():
                  continue
              try:
                  d = json.loads(rp.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"::error::could not parse {repo
rt}: {e}")
                  continue
              for r in d.get("results", []):
                  if r.get("passed"):
                      continue
                  reason = (r.get("error_reason") or "no reason recorded").replace("\n", " ")[:500]
                  print(f"::error title={r.get('gate_id','gate')}::GATE FAILED: "
                        f"{r.get('gate_id','?')} ({r.get('name','?')}) - {reason}")
                  out = (r.get("output") or "")
                  shown = 0
                  for line in out.splitlines():
                      line = line.strip()
                      if (line.startswith("FAIL") or "Failed " in line
                              or "Error Message" in line or "Assert" in line[:80]):
                          print(f"::error title={r.get('gate_id','gate')}:: {line[:500]}")
                          shown += 1
                          if shown >= 25:
                              print(f"::error title={r.get('gate_id','gate')}:: (output truncated)")
                              break
          PY

      - name: Generate GitHub Actions Step Summary
        if: always()
        run: |
          if [ -f "build/reports/gate-results.json" ]; then
            python3 scripts/ci/github-step-summary.py --input build/reports/gate-results.json >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Gate Run Artifacts (Results & Failure Report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-report
          path: build/reports/
          if-no-files-found: ignore
