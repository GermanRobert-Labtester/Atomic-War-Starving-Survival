# ASHFALL primary CI gate — Unity 6000.5.5f1 (AUDIT-001 / AUDIT-006)
# Pins editor version explicitly so package resolve matches ProjectVersion.txt.
name: ASHFALL CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 6000.5.5f1

jobs:
  validate:
    name: Data Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate StreamingAssets JSON syntax
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("Assets/StreamingAssets")
          errors = []
          if not root.exists():
              print(f"WARN: {root} missing — skipping JSON syntax scan")
              sys.exit(0)
          for p in sorted(root.rglob("*.json")):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  errors.append(f"{p}: {e}")
          if errors:
              print("JSON validation FAILED:")
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK: validated {sum(1 for _ in root.rglob('*.json'))} JSON file(s) under {root}")
          PY

      - name: Assert ProjectVersion is 6000.5.5f1
        run: |
          grep -q 'm_EditorVersion: 6000.5.5f1' ProjectSettings/ProjectVersion.txt
          echo "ProjectVersion pin OK: 6000.5.5f1"

  # The generators are the source of truth for Assets/_Game/Data/Generated and
  # Gameplay.unity. Without this gate they quietly become decoration: someone
  # hand-edits a catalog or the scene, the next regeneration silently reverts it,
  # and nothing ever says so.
  #
  # The two halves are gated differently, because only one of them is byte-stable:
  #
  #   Data assets  -> compared byte-for-byte. Re-running GenerateAll over an
  #                   unchanged project produces an identical tree (verified: a
  #                   full EditMode run, which calls GenerateAll in SetUp, leaves
  #                   the working tree clean).
  #   Gameplay.unity -> NOT compared. Unity assigns fresh local fileIDs every time
  #                   it saves a scene built from scratch, so two consecutive
  #                   builds of identical input differ by ~480 lines (measured).
  #                   A byte-diff here would fail on every single run. The real
  #                   gate is that BuildGameplayScene throws SceneBuildException
  #                   on any unassigned reference, so the build step below failing
  #                   IS the check.
  regenerate:
    if: ${{ env.UNITY_LICENSE != '' }}
    name: Generated Assets Are Current
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-regen-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-regen-${{ env.UNITY_VERSION }}-

      # targetPlatform is required by unity-builder even when buildMethod does
      # no building; Linux is the one target installed on this image.
      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.5.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: AtomicWar._Game.Editor.CatalogGenerator.GenerateAll
          allowDirtyBuild: true

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.5.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: AtomicWar._Game.Editor.GameplaySceneBuilder.BuildGameplayScene
          allowDirtyBuild: true

      - name: Fail if regenerated data differs from committed
        run: |
          # Scene excluded on purpose -- see the comment on this job.
          if ! git diff --quiet -- Assets/_Game/Data/Generated; then
            echo "Regenerated data assets differ from what is committed."
            echo "Re-run Tools/ASHFALL/Generate Catalogs, then commit the result."
            git diff --stat -- Assets/_Game/Data/Generated
            exit 1
          fi
          echo "OK: generated data assets are current."

  test:
    if: ${{ env.UNITY_LICENSE != '' }}
    name: EditMode Tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: .
          unityVersion: 6000.5.5f1
          testMode: EditMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-editmode
          path: test-results

  test-playmode:
    if: ${{ env.UNITY_LICENSE != '' }}
    name: PlayMode Tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-play-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-play-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: .
          unityVersion: 6000.5.5f1
          testMode: PlayMode
          artifactsPath: test-results-playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-playmode
          path: test-results-playmode

  build-linux:
    if: ${{ env.UNITY_LICENSE != '' }}
    name: Build Linux64
    needs: [test, test-playmode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Linux-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          buildTarget: StandaloneLinux64
          buildsPath: builds
          unityVersion: 6000.5.5f1

      - uses: actions/upload-artifact@v4
        with:
          name: build-Linux64
          path: builds/StandaloneLinux64
