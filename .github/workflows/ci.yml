# ASHFALL CI — Godot 4.7 .NET (Canonical Shared Verification Pipeline)
# Driven by docs/ci/CI_GATE_MANIFEST.json via scripts/ci/run-gates.py.
# Local developer parity: bash scripts/ci/verify-fast.sh
# Standalone Godot host; no JsonUtility; Core stays engine-agnostic.

name: ASHFALL CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: CI Fast-Tier Gates (dotnet + godot headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          # The size monitor compares the PR merge commit (or push) with its
          # first parent without fetching the full divergent branch history.
          fetch-depth: 2

      - name: Setup Rust for repository monitors and dev tools
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET SDKs (8.0 for Godot host, 9.0 for tests)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Setup Godot 4.7.1 mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Verify Approved Plan for Code Changes
        run: |
          if [ -x "bin/check-approved-plan" ]; then
            bin/check-approved-plan
          else
            cargo run --release --manifest-path tools/rstools/Cargo.toml -p ashfall-dev -- check-plan
          fi

      - name: Execute Canonical Verification Suite (Fast Tier)
        run: |
          python3 scripts/ci/run-gates.py --tier fast --report-json build/reports/gate-results.json --fail-artifact build/reports/CI_GATE_FAILURE_REPORT.md

      - name: Extract Scene Binding Runtime Report
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          source = pathlib.Path("build/reports/gate-results.json")
          target = pathlib.Path("build/reports/scene-binding-report.txt")
          rows = []
          if source.is_file():
              try:
                  report = json.loads(source.read_text(encoding="utf-8"))
                  for result in report.get("results", []):
                      output = result.get("output") or ""
                      rows.extend(line.strip() for line in output.splitlines()
                                  if "[SCENE_BIND_REPORT]" in line)
              except (OSError, json.JSONDecodeError) as error:
                  rows.append(f"[SCENE_BIND_REPORT] report parse error: {error}")
          if not rows:
              rows.append("[SCENE_BIND_REPORT] no runtime report emitted in this gate run")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"scene binding report rows: {len(rows)} -> {target}")
          PY

      # Track C tiering: the full core suite runs on merge (push to main/master)
      # and nightly (.github/workflows/nightly-core-suite.yml), not on every PR.
      # The PR path keeps the fast tier above, which still builds the test
      # project via the `build_core_tests` gate, so compile regressions surface.
      - name: Execute Full Core xUnit Regression Gate
        if: github.event_name == 'push'
        run: |
          python3 scripts/ci/run-gates.py --gate test_core_suite --report-json build/reports/core-test-results.json --fail-artifact build/reports/CORE_TEST_FAILURE_REPORT.md

      - name: Surface Gate Failures as Annotations
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          for report in ("build/reports/gate-results.json",
                         "build/reports/core-test-results.json"):
              rp = pathlib.Path(report)
              if not rp.is_file():
                  continue
              try:
                  d = json.loads(rp.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"::error::could not parse {report}: {e}")
                  continue
              for r in d.get("results", []):
                  if r.get("passed"):
                      continue
                  reason = (r.get("error_reason") or "no reason recorded").replace("\n", " ")[:500]
                  print(f"::error title={r.get('gate_id','gate')}::GATE FAILED: "
                        f"{r.get('gate_id','?')} ({r.get('name','?')}) - {reason}")
                  out = (r.get("output") or "")
                  shown = 0
                  for line in out.splitlines():
                      line = line.strip()
                      if (line.startswith("FAIL") or "Failed " in line
                              or "Error Message" in line or "Assert" in line[:80]):
                          print(f"::error title={r.get('gate_id','gate')}:: {line[:500]}")
                          shown += 1
                          if shown >= 25:
                              print(f"::error title={r.get('gate_id','gate')}:: (output truncated)")
                              break
          PY

      - name: Generate GitHub Actions Step Summary
        if: always()
        run: |
          if [ -f "build/reports/gate-results.json" ]; then
            python3 scripts/ci/github-step-summary.py --input build/reports/gate-results.json >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Gate Run Artifacts (Results & Failure Report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-report
          path: build/reports/
          if-no-files-found: ignore
