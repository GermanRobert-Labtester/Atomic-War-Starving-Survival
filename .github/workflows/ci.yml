# ASHFALL primary CI gate — Godot 4.7.1 .NET/C#
# Godot is the only active engine. CI must not invoke Unity tooling.
name: ASHFALL CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ashfall-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  GODOT_VERSION: 4.7.1

jobs:
  validate:
    name: Repository / Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate StreamingAssets JSON syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("Assets/StreamingAssets/Data")
          if not root.is_dir():
              print(f"ERROR: authoritative data directory is missing: {root}")
              sys.exit(1)

          files = sorted(root.rglob("*.json"))
          if not files:
              print(f"ERROR: no JSON catalogs found under {root}")
              sys.exit(1)

          errors = []
          for path in files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("JSON validation FAILED:")
              print("\n".join(errors))
              sys.exit(1)

          print(f"OK: validated {len(files)} JSON file(s) under {root}")
          PY

      - name: Assert Godot project version pins
        shell: bash
        run: |
          grep -Fq 'config/features=PackedStringArray("4.7", "C#", "Compatibility")' project.godot
          grep -Fq '<Project Sdk="Godot.NET.Sdk/4.7.1">' Ashfall.csproj
          echo "Godot project pins OK: project.godot 4.7 / Godot.NET.Sdk 4.7.1"

  core-tests:
    name: Ashfall.Core Tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 and 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore Core tests
        run: dotnet restore Ashfall.Core.Tests/Ashfall.Core.Tests.csproj

      - name: Build Core tests
        run: dotnet build Ashfall.Core.Tests/Ashfall.Core.Tests.csproj --configuration Release --no-restore

      - name: Run Core tests
        run: >-
          dotnet test Ashfall.Core.Tests/Ashfall.Core.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=ashfall-core-tests.trx"
          --results-directory TestResults

      - name: Upload Core test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashfall-core-test-results
          path: TestResults
          if-no-files-found: warn

  godot-gates:
    name: Godot Headless Gates
    needs: [validate, core-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 8 and 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: false

      - name: Verify toolchain
        shell: bash
        run: |
          dotnet --version
          godot --version
          godot --version | grep -q '^4\.7\.1'

      - name: Prepare repository scripts
        shell: bash
        run: |
          chmod +x setup-repo.sh
          chmod +x scripts/ci/godot-asset-gate.sh
          if [[ -f scripts/ci/asset-orphan-sweep.sh ]]; then
            chmod +x scripts/ci/asset-orphan-sweep.sh
          fi

      - name: Run canonical Godot asset and gameplay gates
        shell: bash
        run: ./scripts/ci/godot-asset-gate.sh

      - name: Upload Godot import log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: godot-import-log
          path: /tmp/godot-import.log
          if-no-files-found: ignore
