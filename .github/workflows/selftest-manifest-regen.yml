# ASHFALL Selftest Manifest Regen — regenerator for
# docs/ci/SELFTEST_MANIFEST.json, which must stay byte-identical to the live
# HostCliRegistry output queried from the built Godot host.
# The fix branch is protected by a ruleset that blocks GITHUB_TOKEN pushes and
# force-pushes, so the regenerated manifest goes to a fresh run-unique branch
# that is merged into the fix branch via an authenticated PR.

name: Selftest Manifest Regen

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/selftest-manifest-regen.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: selftest-manifest-regen
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate SELFTEST_MANIFEST.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDKs (8.0 for Godot host, 9.0 for tests)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Godot 4.7.1 mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Build Godot host
        run: dotnet build Ashfall.csproj --nologo

      - name: Regenerate selftest manifest
        run: python3 scripts/ci/generate-selftest-manifest.py

      - name: Verify manifest drift gate passes
        run: python3 scripts/ci/generate-selftest-manifest.py --check

      - name: Commit regenerated manifest (best-effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ashfall-docs-regen[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/SELFTEST_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No drift — nothing to commit."
            exit 0
          fi
          git commit -m "ci: regenerate SELFTEST_MANIFEST.json from HostCliRegistry (automated)"
          # Push to a run-unique branch (branch creation is allowed; force-push
          # is blocked by the repository ruleset). The branch is merged into
          # the fix branch via an authenticated PR.
          AUTOGEN_BRANCH="ci-autogen-${GITHUB_RUN_ID}"
          if out=$(git push origin HEAD:refs/heads/$AUTOGEN_BRANCH 2>&1); then
            echo "Pushed regenerated manifest to $AUTOGEN_BRANCH."
            # Open a PR so the branch lands and is auto-deleted on merge instead
            # of accumulating as an orphan branch. Best-effort.
            if ! gh pr create --base main --head "$AUTOGEN_BRANCH" \
                 --title "ci: regenerate SELFTEST_MANIFEST.json (automated)" \
                 --body "Automated regeneration from run ${GITHUB_RUN_ID}. Land via merge; the branch is then cleaned up by ci-autogen-cleanup.yml." ; then
              echo "::warning::could not open a PR for $AUTOGEN_BRANCH (branch pushed; clean up via ci-autogen-cleanup.yml)"
            fi
          else
            echo "::error::MANIFEST-REGEN PUSH FAILED — ${out}"
            exit 1
          fi