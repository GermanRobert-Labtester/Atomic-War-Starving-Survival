name: Port Contract Diag
on: push
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump offending source region
        run: |
          sed -n "267,276p" scripts/ci/generate-port-contract.py > /tmp/src.txt
          cat -A /tmp/src.txt | head -3
          awk '{ printf "PC-SRC-L%d: %s\n", NR+266, $0 }' /tmp/src.txt | cut -c1-700 | head -10 | sed "s/^/::error::/"
