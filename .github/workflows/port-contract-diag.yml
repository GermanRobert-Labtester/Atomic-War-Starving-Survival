name: Port Contract Diag
on: push
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump exact bytes of lines 264-276
        run: |
          sed -n "264,276p" scripts/ci/generate-port-contract.py | base64 -w 0 > /tmp/b64.txt
          echo "::error::PC-B64-1: $(cut -c1-600 /tmp/b64.txt)"
          echo "::error::PC-B64-2: $(cut -c601-1200 /tmp/b64.txt)"
          echo "::error::PC-B64-3: $(cut -c1201-1800 /tmp/b64.txt)"
          echo "::error::PC-B64-4: $(cut -c1801-2400 /tmp/b64.txt)"
