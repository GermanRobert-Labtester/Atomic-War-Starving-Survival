name: Port Contract Diag
on: push
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump offending source region
        run: |
          sed -n "258,284p" scripts/ci/generate-port-contract.py > /tmp/src.txt
          cat -n /tmp/src.txt
          awk '{ printf "PC-SRC-L%d: %s\n", NR+257, $0 }' /tmp/src.txt | cut -c1-650 | head -30 | sed "s/^/::error::/"
