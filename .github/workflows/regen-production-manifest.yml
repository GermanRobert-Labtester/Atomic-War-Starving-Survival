name: Regenerate production art manifest (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/regen-production-manifest.yml'
      - 'tools/production_manifest.py'
      - 'docs/visual/WIRING_MATRIX.json'
      - 'assets/art/**'

permissions:
  contents: read

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'maintenance/authority-ci-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/authority-ci-policy

      - name: Run canonical production manifest generator
        run: python3 tools/production_manifest.py

      - name: Upload regenerated production manifest
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-production-art-manifest
          path: docs/visual/PRODUCTION_ART_GENERATION_MANIFEST.json
          if-no-files-found: error
          retention-days: 1
