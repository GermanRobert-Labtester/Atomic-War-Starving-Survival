name: Regenerate production art manifest (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/regen-production-manifest.yml'
      - 'tools/production_manifest.py'
      - 'docs/visual/WIRING_MATRIX.json'
      - 'assets/art/**'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'maintenance/authority-ci-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/authority-ci-policy

      - name: Run canonical production manifest generator
        run: python3 tools/production_manifest.py

      - name: Create detached Git commit for regenerated manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          src = Path('docs/visual/PRODUCTION_ART_GENERATION_MANIFEST.json')
          Path('/tmp/blob-request.json').write_text(json.dumps({
              'content': base64.b64encode(src.read_bytes()).decode('ascii'),
              'encoding': 'base64'
          }))
          PY
          blob_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob-request.json --jq .sha)"
          head_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          python3 - "$base_tree" "$blob_sha" <<'PY'
          import json, sys
          from pathlib import Path
          base_tree, blob_sha = sys.argv[1], sys.argv[2]
          Path('/tmp/tree-request.json').write_text(json.dumps({
              'base_tree': base_tree,
              'tree': [{
                  'path': 'docs/visual/PRODUCTION_ART_GENERATION_MANIFEST.json',
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob_sha
              }]
          }))
          PY
          tree_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree-request.json --jq .sha)"
          python3 - "$tree_sha" "$head_sha" <<'PY'
          import json, sys
          from pathlib import Path
          tree_sha, head_sha = sys.argv[1], sys.argv[2]
          Path('/tmp/commit-request.json').write_text(json.dumps({
              'message': 'chore(art): regenerate production manifest',
              'tree': tree_sha,
              'parents': [head_sha]
          }))
          PY
          commit_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input /tmp/commit-request.json --jq .sha)"
          printf '%s\n' "$commit_sha" | tee /tmp/generated-commit-sha.txt

      - name: Upload generated commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-production-art-commit
          path: /tmp/generated-commit-sha.txt
          if-no-files-found: error
          retention-days: 1
