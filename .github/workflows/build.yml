# Unity compatibility artifact build. Unity version pinned to ProjectVersion.txt.
#
# Canonical gameplay verification lives in ci.yml and uses Core + Godot/.NET.
# This workflow deliberately does not duplicate that test battery; it only checks
# that the retained Unity compatibility surface can still produce platform artifacts.
# See docs/ENGINE_SUPPORT_POLICY.md.
name: Build ASHFALL (Unity Compatibility)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 6000.5.5f1

jobs:
  build-windows:
    if: ${{ env.UNITY_LICENSE != '' && env.UNITY_EMAIL != '' && env.UNITY_PASSWORD != '' }}
    name: Build Windows Compatibility Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Windows-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          buildTarget: StandaloneWindows64
          buildsPath: builds
          unityVersion: 6000.5.5f1

      - uses: actions/upload-artifact@v4
        with:
          name: unity-compat-Windows
          path: builds/StandaloneWindows64

  build-webgl:
    if: ${{ env.UNITY_LICENSE != '' && env.UNITY_EMAIL != '' && env.UNITY_PASSWORD != '' }}
    name: Build WebGL Compatibility Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-WebGL-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          buildTarget: WebGL
          buildsPath: builds
          unityVersion: 6000.5.5f1

      - uses: actions/upload-artifact@v4
        with:
          name: unity-compat-WebGL
          path: builds/WebGL
