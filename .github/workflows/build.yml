# Build ASHFALL — Godot export (replaces Unity 6000.5.5f1 builds)
# Uses project.godot export_presets.cfg: Linux/X11 + Windows Desktop.
# ci.yml is the test gate; this workflow only exports release builds.
# See AGENTS.md: verification is dotnet + godot --headless; never Unity.

name: Build ASHFALL

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-linux:
    name: Export Linux/X11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Godot 4.7.1 mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: dotnet build Godot host
        run: dotnet build Ashfall.csproj --nologo

      - name: godot --import
        run: godot --headless --path . --import 2>&1 | tail -n 20

      - name: Export Linux/X11
        run: |
          mkdir -p builds/linux
          godot --headless --path . --export-release "Linux/X11" builds/linux/ashfall.x86_64
          ls -lh builds/linux/
          test -f builds/linux/ashfall.x86_64
          # PCK should embed Data; also verify executable-adjacent Data for isolated CI gate
          ls -lh builds/linux/*.pck 2>/dev/null || echo "no pck (embed_pck=false — Data beside binary)"

      - name: Verify export includes data authority
        run: |
          # Either embedded in PCK or beside binary — one must exist
          if [ -f "builds/linux/ashfall.pck" ]; then
            echo "PCK found; Data embedded or beside binary per export_presets.cfg"
          fi
          # Quick smoke: run data-integrity on exported Data if present
          if [ -d "builds/linux/Assets/StreamingAssets/Data" ]; then
            echo "Exported Data on disk — verifying isolated selftest layout"
            ls builds/linux/Assets/StreamingAssets/Data/*.json | head -n 5
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-Linux
          path: builds/linux

  export-windows:
    name: Export Windows Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Godot 4.7.1 mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: dotnet build Godot host
        run: dotnet build Ashfall.csproj --nologo

      - name: godot --import
        run: godot --headless --path . --import 2>&1 | tail -n 20

      - name: Export Windows Desktop
        run: |
          mkdir -p builds/windows
          godot --headless --path . --export-release "Windows Desktop" builds/windows/ashfall.exe
          ls -lh builds/windows/
          test -f builds/windows/ashfall.exe

      - uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: builds/windows
