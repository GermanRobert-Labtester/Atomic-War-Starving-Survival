# Release-style multi-platform build. Unity version pinned to match ProjectVersion.txt.
#
# Deliberately does NOT run tests. ci.yml is the gate (data validation → EditMode →
# PlayMode → Linux build) and fires on the same push/PR events, so an EditMode job
# here was a second identical Unity run on every pull request: double the CI minutes
# and two red checks for one failure. Post-merge platform builds only.
name: Build ASHFALL

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 6000.5.5f1

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Windows-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          buildTarget: StandaloneWindows64
          buildsPath: builds
          unityVersion: 6000.5.5f1

      - uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: builds/StandaloneWindows64

  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-WebGL-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          buildTarget: WebGL
          buildsPath: builds
          unityVersion: 6000.5.5f1

      - uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: builds/WebGL
