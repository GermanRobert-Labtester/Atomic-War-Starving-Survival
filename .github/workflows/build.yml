# Release-style multi-platform build. Unity version pinned to match ProjectVersion.txt.
name: Build ASHFALL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 6000.5.5f1

jobs:
  test:
    name: EditMode Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: .
          unityVersion: 6000.5.5f1
          testMode: EditMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  build-windows:
    name: Build Windows
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Windows-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          buildTarget: StandaloneWindows64
          buildsPath: builds
          unityVersion: 6000.5.5f1

      - uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: builds/StandaloneWindows64

  build-webgl:
    name: Build WebGL
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-WebGL-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          buildTarget: WebGL
          buildsPath: builds
          unityVersion: 6000.5.5f1

      - uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: builds/WebGL
