name: Obligation Dedup Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dedup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate obligation registrations
        id: dedup
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import sys
          vpath = 'Assets/Ashfall.Core/Campaign/DayEventVocabulary.cs'
          mpath = 'docs/campaign/EVENT_SEMANTIC_PARITY_MATRIX.md'
          v = open(vpath, encoding='utf-8').read()
          m = open(mpath, encoding='utf-8').read()
          dupes = [
              '            { "obligation_warning", SemanticKind.Hazard },
',
              '            { "obligation_missed", SemanticKind.Production },
',
          ]
          rows = [
              '| `obligation_missed` | CommitmentSystem.cs | generic default | via briefing panel | GENERIC (visible) |
',
              '| `obligation_warning` | CommitmentSystem.cs | generic default | via briefing panel | GENERIC (visible) |
',
          ]
          if all(v.count(d) == 0 for d in dupes):
              print('already clean; nothing to do')
              sys.exit(0)
          for d in dupes:
              if v.count(d) != 1:
                  print('::error::unexpected vocab state, count=' + str(v.count(d)) + ' for ' + d.strip())
                  sys.exit(1)
              v = v.replace(d, '')
          for r in rows:
              if m.count(r) != 1:
                  print('::error::unexpected matrix state, count=' + str(m.count(r)))
                  sys.exit(1)
              m = m.replace(r, '')
          for k in ('obligation_warning', 'obligation_missed'):
              n = sum(1 for line in v.split('
') if ('{ "' + k + '"') in line)
              if n != 1:
                  print('::error::' + k + ' appears ' + str(n) + ' times in vocab after dedup')
                  sys.exit(1)
              nm = sum(1 for line in m.split('
') if ('`' + k + '`') in line)
              if nm != 1:
                  print('::error::' + k + ' appears ' + str(nm) + ' times in matrix after dedup')
                  sys.exit(1)
          open(vpath, 'w', encoding='utf-8').write(v)
          open(mpath, 'w', encoding='utf-8').write(m)
          print('dedup ok')
          EOF
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and create PR
        if: steps.dedup.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "ashfall-autogen"
          git config user.email "actions@github.com"
          BRANCH="ci-dedup-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix(core): dedupe obligation day-event kind registrations after #46/#47 double-merge"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "fix(core): dedupe obligation day-event kind registrations" \
            --body "Automated dedup after the #46/#47 double-merge. Keeps the Plan 38 Narrative classification from #46; drops the duplicate Hazard/Production entries from #47 that produced duplicate SemanticKindMap keys and crashed the static initializer."
