<!DOCTYPE html>

<style>
        /* Cinematic & Textural Effects */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
            pointer-events: none;
            z-index: 11;
            opacity: 0.03;
            background: black;
        }

        @keyframes flicker {
            0% { opacity: 0.02; }
            50% { opacity: 0.05; }
            100% { opacity: 0.02; }
        }

        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }

        .worn-edge-top {
            position: relative;
        }
        .worn-edge-top::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 1" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 L5,1 L10,0 L15,0.5 L20,0 L25,1 L30,0 L100,0.5" stroke="black" fill="none"/></svg>');
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 1" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 L5,1 L10,0 L15,0.5 L20,0 L25,1 L30,0 L100,0.5" stroke="black" fill="none"/></svg>');
        }

        .interactive-hover {
            transition: all 0.3s ease;
        }
        .interactive-hover:hover {
            color: #a1cfd3; /* secondary */
            background-color: rgba(34, 80, 84, 0.2); /* secondary-container/20 */
        }
        .interactive-active {
            color: #a1cfd3;
            border-left-width: 4px;
            border-color: #ffc9b0; /* tertiary-container - burnt orange substitute */
            padding-left: 1rem;
            font-weight: bold;
            transform: scale(0.98);
            transition: transform 0.2s;
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden font-body-md select-none">
<!-- Background Layer -->
<div class="absolute inset-0 z-0">
<img alt="Cinematic frozen wasteland ruins" class="w-full h-full object-cover opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuClFO_PliE1bFntKH_hqRS_UJCQun8KY5PFS8YN2avGaH64hqSmxz-NU1uaI_Q4DfPOSpg1XZs3X4C8jLn6vt2nQlK48pPLvtYuQVw8UQbcuwM7h6-B9iVcA92RVW-GRMTLQdmrLJ4859ueFK1BIE9dwYBJtUARuBINXDXTohNZyGDnEBISQ11yi8-6M5FHFkNpGDjGcskl5vAuvcg394Wxh_wGD7COHYXgj2vWuQHH8V7sJexnhpTErORMlOvAebafTV3zDaIo_DiT"/>
</div>
<!-- Overlays -->
<div class="vignette absolute inset-0"></div>
<div class="scanlines absolute inset-0"></div>
<div class="crt-flicker absolute inset-0"></div>
<!-- Main UI Container -->
<main class="relative z-20 w-full h-full flex p-margin-edge">
<!-- Side Navigation Bar (Menu Area) -->
<nav class="fixed left-0 top-0 h-full flex flex-col py-stack-lg z-40 bg-surface-container-low/80 border-r border-outline-variant/30 docked left-0 h-full w-80 worn-edge-top backdrop-blur-sm">
<!-- Header Section -->
<div class="px-margin-edge mb-stack-lg mt-12">
<h2 class="font-subheading text-subheading text-outline tracking-widest mb-unit">SECTOR-01</h2>
<p class="font-code-data text-code-data text-outline-variant">FIELD MANUAL V.2.04</p>
</div>
<!-- Navigation Links -->
<ul class="flex flex-col space-y-2 px-6">
<!-- CONTINUE (Active State) -->
<li>
<button class="w-full flex items-center space-x-4 py-3 pl-4 text-left font-subheading text-subheading text-secondary font-bold border-l-4 border-tertiary-container interactive-active group">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span>CONTINUE</span>
</button>
</li>
<!-- NEW GAME -->
<li>
<button class="w-full flex items-center space-x-4 py-3 pl-4 text-left font-subheading text-subheading text-on-surface-variant font-normal interactive-hover group">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">add_box</span>
<span>NEW GAME</span>
</button>
</li>
<!-- LOAD GAME -->
<li>
<button class="w-full flex items-center space-x-4 py-3 pl-4 text-left font-subheading text-subheading text-on-surface-variant font-normal interactive-hover group">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">save</span>
<span>LOAD GAME</span>
</button>
</li>
<!-- SETTINGS -->
<li>
<button class="w-full flex items-center space-x-4 py-3 pl-4 text-left font-subheading text-subheading text-on-surface-variant font-normal interactive-hover group">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">settings</span>
<span>SETTINGS</span>
</button>
</li>
<!-- CREDITS -->
<li>
<button class="w-full flex items-center space-x-4 py-3 pl-4 text-left font-subheading text-subheading text-on-surface-variant font-normal interactive-hover group">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">info</span>
<span>CREDITS</span>
</button>
</li>
</ul>
<!-- Spacer -->
<div class="flex-grow"></div>
<!-- QUIT -->
<div class="px-6 pb-margin-edge">
<button class="w-full flex items-center space-x-4 py-3 pl-4 text-left font-subheading text-subheading text-on-surface-variant font-normal interactive-hover group border-t border-outline-variant/30 pt-4">
<span class="material-symbols-outlined text-[20px] text-error" style="font-variation-settings: 'FILL' 0;">power_settings_new</span>
<span class="text-error">QUIT</span>
</button>
</div>
</nav>
<!-- Right Side Canvas (Title Area) -->
<div class="ml-80 flex-grow flex flex-col justify-center items-start pl-margin-edge relative">
<h1 class="font-headline-xl text-headline-xl md:text-[120px] md:leading-[120px] text-primary tracking-widest uppercase opacity-90 drop-shadow-lg">
                ASHFALL
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-stack-sm opacity-80 max-w-lg">
                After the flash, the cold remains.
            </p>
<!-- Atmospheric Data Panel (Non-interactive) -->
<div class="absolute bottom-margin-edge right-margin-edge bg-surface/40 backdrop-blur-sm border border-outline-variant/30 p-4 rounded-sm worn-edge-top hidden md:block">
<div class="flex justify-between items-center mb-2 pb-2 border-b border-outline-variant/30">
<span class="font-label-caps text-label-caps text-outline">ENVIRONMENTAL STATUS</span>
<span class="material-symbols-outlined text-outline text-[16px]">thermostat</span>
</div>
<div class="space-y-2">
<div class="flex justify-between">
<span class="font-code-data text-code-data text-on-surface-variant">TEMP_EXT</span>
<span class="font-code-data text-code-data text-secondary">-42°C</span>
</div>
<div class="flex justify-between">
<span class="font-code-data text-code-data text-on-surface-variant">RAD_LEVEL</span>
<span class="font-code-data text-code-data text-tertiary-container">0.85 Sv/h</span>
</div>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 left-0 w-full flex justify-between px-margin-edge py-stack-sm z-50 bg-surface/40 backdrop-blur-sm border-t border-outline-variant/10">
<div class="font-label-caps text-label-caps text-outline hover:text-on-surface transition-colors cursor-default">
            © 2024 WASTELAND PROTOCOLS. ALL RIGHTS RESERVED.
        </div>
<div class="flex space-x-8 font-label-caps text-label-caps text-outline">
<span class="hover:text-on-surface transition-colors cursor-default">SYSTEM STATUS: STABLE</span>
<span class="hover:text-on-surface transition-colors cursor-default">ENCRYPTION: ACTIVE</span>
</div>
</footer>
<script>
        // Simple ambient noise effect on menu items to simulate failing hardware
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                btn.style.opacity = '0.8';
                setTimeout(() => btn.style.opacity = '1', 50);
                setTimeout(() => btn.style.opacity = '0.9', 100);
                setTimeout(() => btn.style.opacity = '1', 150);
            });
        });
    </script>
</body></html>
